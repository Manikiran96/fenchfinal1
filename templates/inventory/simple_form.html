{% extends "base.html" %}
{% block title %}{{ title }} - Solar ERP{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ title }}</h1></div>
<form method="post" class="card form-grid">{% csrf_token %}
  {% for field in form %}<div class="field"><label>{{ field.label }}</label>{{ field }}{% for e in field.errors %}<div class="err">{{ e }}</div>{% endfor %}</div>{% endfor %}
  <div class="form-actions"><a class="btn" href="{% url back %}">Cancel</a><button class="btn primary" type="submit">Save</button></div>
</form>
{% endblock %}
