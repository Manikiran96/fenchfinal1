{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1220">
  <title>{% block title %}Solar ERP{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/portal.css' %}">
</head>
<body>
  <header class="p-top">
    <div class="p-top-title">{% block header %}Solar ERP{% endblock %}</div>
    <a class="p-logout" href="{% url 'accounts:logout' %}">Logout</a>
  </header>

  <main class="p-main">
    {% if messages %}
      <div class="p-msgs">{% for m in messages %}<div class="p-msg {{ m.tags }}">{{ m }}</div>{% endfor %}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <!-- Bottom navigation (role-specific) -->
  <nav class="p-nav">
    {% block nav %}{% endblock %}
  </nav>
</body>
</html>
